# Load balancer in front of the two Kong instances.
#
# Docker's embedded DNS (127.0.0.11) returns one A record per api-gateway
# replica and rotates their order, so re-resolving per request spreads traffic
# across both. A static `upstream` block would resolve once at startup and go
# stale the moment failure injection restarts a gateway container with a new
# IP -- which is exactly the scenario this pair exists to survive.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8000;

    # Keep serving from the surviving instance while the other is down or
    # restarting, instead of returning its error to the caller.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;

    location / {
        set $gateway http://api-gateway:8000;
        proxy_pass $gateway$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
