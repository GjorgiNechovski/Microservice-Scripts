# Load balancer for blog-service.
#
# Docker's embedded DNS returns one A record per replica and rotates them, so
# re-resolving per request spreads load AND keeps up when a container is
# replaced. A static upstream block resolves once at boot and pins the IP --
# after a restart that address can belong to a DIFFERENT service, which sends
# traffic to the wrong backend with no error anywhere.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;

    location / {
        set $backend http://blog-service:8000;
        proxy_pass $backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
