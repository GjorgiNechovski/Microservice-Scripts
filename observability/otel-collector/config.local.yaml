# Local-only variant of config.yaml: nothing leaves this machine.
#
# Metrics go to Prometheus exactly as in config.yaml, which is all the analyzer
# reads. Traces are accepted (so an instrumented service never sees export
# errors) but only counted by the debug exporter, never forwarded to Honeycomb.
# Use it when no Honeycomb key is available, or when the system under test must
# not send telemetry off the host. Select it in observability/.env:
#
#   OTEL_COLLECTOR_CONFIG=config.local.yaml
#
# HONEYCOMB_API_KEY is then not needed.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
